# pl1-cap configuration: package PL1 per GNOME power mode, applied on AC.
#
# The daemon re-reads this file every loop, so edits take effect within a
# second with no restart. Values are microwatts (21 W = 21000000). See the
# README for why these particular numbers.
CAP_POWERSAVE=11000000
CAP_BALANCED=21000000
CAP_PERFORMANCE=41000000
